# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          # Matches .nvmrc; the webpack config needs Node 22+ (fs/promises glob).
          node-version: '24'
          # Matches the go directive in go.mod.
          go-version: '1.26.5'
          # Signs the plugin once the repository secret GRAFANA_ACCESS_POLICY_TOKEN exists. Add it only
          # after Grafana approves the plugin: public signing is refused before that.
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          attestation: true
